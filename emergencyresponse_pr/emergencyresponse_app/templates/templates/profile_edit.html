{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}

{% block extra_css %}
<style>
body{background:#f5f7fb}
.profile-wrapper{max-width:800px;margin:40px auto}
.profile-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.profile-header{padding:30px;text-align:center;color:#fff;background:linear-gradient(135deg,#0d6efd,#2563eb)}
.profile-avatar{width:90px;height:90px;margin:0 auto 15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(255,255,255,.2)}
.profile-body{padding:35px}
.profile-body p{margin-bottom:18px}
.profile-body label{display:block;font-weight:600;margin-bottom:6px}
.profile-body input,.profile-body select,.profile-body textarea{width:100%;padding:10px 14px;border:1px solid #ced4da;border-radius:10px}
.profile-body input:focus,.profile-body select:focus,.profile-body textarea:focus{outline:0;border-color:#0d6efd;box-shadow:0 0 0 .2rem rgba(13,110,253,.15)}
.profile-footer{padding:20px 35px;background:#f8f9fa;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:10px}
.btn-save,.btn-cancel{padding:10px 24px;border-radius:10px}
.btn-save{padding-inline:28px;font-weight:600}
</style>
{% endblock %}

{% block content %}
<div class="profile-wrapper">
    <div class="profile-card">

        <div class="profile-header">
            <div class="profile-avatar"><i class="fas fa-user"></i></div>
            <h3 class="mb-1">Edit Profile</h3>
            <p class="mb-0 opacity-75">Update your personal information</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="profile-body">
                {{ form.as_p }}
            </div>

            <div class="profile-footer">
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-primary btn-save">
                    <i class="fas fa-save me-2"></i>Save Changes
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
